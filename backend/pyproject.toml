[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-operator-api"
version = "0.1.0"
description = "Cloud API for CAT Operator Copilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlmodel>=0.0.24,<1",
  "uvicorn[standard]>=0.34,<1",
  "lightgbm>=4.0,<5",
  "pandas>=2.0,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.4,<2",
  "httpx>=0.28,<1",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
